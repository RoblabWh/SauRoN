[project]
name = "sauron"
version = "1.0.0"
description = "SauRoN - Simulation for autonomous robot navigation (PPO reinforcement learning)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26,<3",
    "pillow>=10",
    "pyqt5>=5.15.10",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
mpi = ["mpi4py>=4"]

[dependency-groups]
dev = ["ipykernel>=6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
